# Credentials for hive_seaweedfs_test.py, mounted as files at /etc/s3-secrets by the SparkApplication.
# Replace the two CHANGE_ME values before applying, or create the secret directly instead:
#   kubectl -n spark-apps create secret generic hive-seaweedfs-test-secret \
#     --from-literal=SEAWEED_ACCESS_KEY=... --from-literal=SEAWEED_SECRET_KEY=...
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: hive-seaweedfs-test-secret
  namespace: spark-apps
type: Opaque
stringData:
  SEAWEED_ACCESS_KEY: "CHANGE_ME"
  SEAWEED_SECRET_KEY: "CHANGE_ME"
