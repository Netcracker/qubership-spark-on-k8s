{{- if .Values.sparkHiveSeaweedfsIntegrationTests.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-secrets
  namespace: {{ .Values.sparkAppsNamespace }}
  labels:
    {{- include "all_objects_labels_ssit" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install
type: Opaque
stringData:
  WAREHOUSE_URI: {{ .Values.sparkHiveSeaweedfsIntegrationTests.warehouseUri | quote }}
  DB_NAME: {{ .Values.sparkHiveSeaweedfsIntegrationTests.dbName | quote }}
  TABLE_NAME: {{ .Values.sparkHiveSeaweedfsIntegrationTests.tableName | quote }}
{{- end }}
